version: "2"

run:
  timeout: 5m

linters:
  default: standard
  exclusions:
    generated: lax
    paths:
      # Vendored snapshot of golang.org/x/net/webdav. It keeps upstream style;
      # the local patches are listed in internal/webdav/xnet/UPSTREAM.md.
      - internal/webdav/xnet/
  settings:
    errcheck:
      # Writes to stdout/stderr are reported but never actionable for a CLI.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
