# easy-webdav behind nginx. Pick one layout and delete the other.
#
# The service always listens on plain HTTP paths (/ , /api/ , /dav/ , /healthz);
# EW_BASE_URL only changes the <base href> injected into the panel, so the proxy
# is what adds or strips a path prefix.
#
# Tell the server about the proxy so real IPs and https detection work:
#   EW_TRUSTED_PROXIES=127.0.0.1/32

# --- Layout A: serve everything at the domain root (keep EW_BASE_URL=/) -------
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Layout B: serve everything below /files/ (set EW_BASE_URL=/files/) ------
# The panel, the JSON API and WebDAV all live under the prefix; nginx strips it
# before proxying, which is exactly what EW_BASE_URL prepares the SPA for.
location = /files {
    return 301 /files/;
}

location /files/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# WebDAV needs its own block: unbuffered request bodies, no body size limit and
# generous timeouts for large uploads and long-lived COPY/MOVE operations.
# $http_host keeps the port, which matters because the server checks the
# Destination header's host against the request host.
location /files/dav/ {
    proxy_pass http://127.0.0.1:8080/dav/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

