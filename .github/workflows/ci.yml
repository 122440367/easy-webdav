name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: go vet ./...
      - run: go test ./...
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Check frontend gzip size
        shell: bash
        run: test "$(find internal/web/dist -type f -print0 | xargs -0 gzip -c | wc -c)" -lt 512000
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.13.2 }
      - name: Check Conventional Commit pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          echo "$PR_TITLE" | grep -Eq '^(feat|fix|docs|refactor|test|chore|build|ci|perf|revert)(\([^)]+\))?!?: .+'

  compatibility:
    # Docker is only required here: the local development loop never needs it.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - name: Build server binary
        run: go build -o ./easy-webdav ./cmd/easy-webdav
      - name: Start server for compatibility tests
        env:
          EW_DATA_DIR: ${{ runner.temp }}/easy-webdav
          EW_STORAGE_DIR: ${{ runner.temp }}/easy-webdav/files
          EW_LISTEN: 127.0.0.1:8080
          EW_ADMIN_USER: ci
          EW_ADMIN_PASSWORD: ci-password
          EW_LOG_LEVEL: warn
        run: |
          ./easy-webdav &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
      - name: Build litmus (DAV compliance suite)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libxml2-dev libneon27-gnutls-dev zlib1g-dev
          # litmus 0.13 refuses neon newer than 0.29 although it links fine
          # against it, so the version probe is answered by a small shim while
          # every other neon-config call still goes to the real library.
          mkdir -p /tmp/litmus-bin
          printf '#!/bin/sh\nif [ "$1" = "--version" ]; then echo 0.29.0; exit 0; fi\nexec /usr/bin/neon-config "$@"\n' > /tmp/litmus-bin/neon-config
          chmod +x /tmp/litmus-bin/neon-config
          curl -fsSL -o /tmp/litmus.tar.gz https://notroj.github.io/litmus/litmus-0.13.tar.gz
          tar -xzf /tmp/litmus.tar.gz -C /tmp
          cd /tmp/litmus-0.13
          PATH=/tmp/litmus-bin:$PATH ./configure --with-neon
          make
          sudo make install
      - name: litmus DAV compliance
        run: TESTS="basic copymove locks http" litmus http://127.0.0.1:8080/dav/ ci ci-password
      - name: litmus props (informational)
        # The disk-backed file system in x/net does not store dead properties,
        # so 4 of the 14 props tests fail with the documented 207+403 propstat
        # answer. Everything else must pass above.
        continue-on-error: true
        run: TESTS="props" litmus http://127.0.0.1:8080/dav/ ci ci-password
      - name: rclone create, upload, rename and delete
        run: |
          docker run --rm --network host --entrypoint sh rclone/rclone -c '
            set -e
            rclone config create ew webdav url=http://127.0.0.1:8080/dav/ vendor=other user=ci pass=ci-password --obscure
            mkdir -p /tmp/ci && echo hello > /tmp/ci/hello.txt
            rclone mkdir ew:compat
            rclone copy /tmp/ci/hello.txt ew:compat
            rclone lsf ew:compat
            rclone moveto ew:compat/hello.txt ew:compat/renamed.txt
            rclone delete ew:compat/renamed.txt
          '
