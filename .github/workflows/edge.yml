name: Edge image

# Publishes :edge from main so people can try the unreleased build without
# waiting for a tag. Tagged releases are handled by release.yml.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'openspec/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:edge
          build-args: |
            VERSION=edge
            COMMIT=${{ github.sha }}
            BUILT=${{ github.run_started_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
