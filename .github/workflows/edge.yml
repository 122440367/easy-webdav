name: Edge image

# Publishes :edge from main so people can try the unreleased build without
# waiting for a tag. Tagged releases are handled by release.yml.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'openspec/**']
  workflow_dispatch:

# Rapid pushes used to leave several multi-arch builds writing the same cache
# at once, which stalled them for tens of minutes.
concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:edge
          build-args: |
            VERSION=edge
            COMMIT=${{ github.sha }}
            BUILT=${{ github.run_started_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
