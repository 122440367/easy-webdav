name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      # The image is built below with buildx (qemu supplies the arm64
      # emulation, the container driver supports multi-platform output).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Binaries, archives, checksums and release notes come from goreleaser;
      # the multi-arch image is built here because deploy/Dockerfile compiles
      # the project from source and needs the whole repository as its context.
      - id: image
        name: Compute image metadata
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME},ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME%.*},ghcr.io/${GITHUB_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILT=${{ github.run_started_at }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
