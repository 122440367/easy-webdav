version: 2
project_name: easy-webdav
before:
  hooks:
    - go mod tidy
builds:
  - id: binaries
    main: ./cmd/easy-webdav
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.built={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
# The container image is built and pushed by .github/workflows/release.yml with
# docker/build-push-action: goreleaser's docker pipeline hands the Dockerfile a
# context that only contains its own artifacts, while deploy/Dockerfile compiles
# the frontend and backend from the repository sources.
release:
  prerelease: auto
  header: "## easy-webdav {{ .Tag }}"
changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
